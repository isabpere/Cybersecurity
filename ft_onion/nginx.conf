events {
    worker_connections 1024;
}

http {
    include       mime.types;        # so the browser gets the right content type (text/html, etc.)
    default_type  application/octet-stream;

    server_tokens off;
    server {
        listen 127.0.0.1:80;
        server_name localhost;

        root  /usr/share/nginx/html; # index.html is here
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}   